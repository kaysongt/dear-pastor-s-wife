<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join Dear Pastor's Wife's mailing list for future retreats, conferences, tea parties, and community news." />
  <meta name="theme-color" content="#601938" />
  <title>Stay informed | Dear Pastor's Wife</title>
  <link rel="canonical" href="https://dearpastorswife.org/stay-informed.html" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="events">
  <div data-chrome="top"></div>
  <main id="top">
    <section class="page-hero section-shell">
      <p class="eyebrow">Stay connected</p>
      <h1>There's more to come.</h1>
      <p>Be the first to hear about future DPW retreats, conferences, and tea parties. We'd love to see you at our next gathering.</p>
    </section>
    <section class="section-shell page-section" style="max-width:680px;padding-top:0">
      <div class="event-reg-card">
        <h2>Stay informed</h2>
        <p class="give-sub">Join our mailing list for event announcements and news from Dear Pastor's Wife.</p>
        <form id="stayInformedForm" class="stepper-form">
          <label><span>First name</span><input type="text" name="firstName" required autocomplete="given-name" /></label>
          <label><span>Email</span><input type="email" name="email" required autocomplete="email" placeholder="you@example.com" /></label>
          <label class="check-row"><input type="checkbox" name="consent" required /><span>I'd like to receive DPW's newsletter, future-event announcements, and community news. I can unsubscribe at any time.</span></label>
          <button class="button primary" type="submit">Keep me informed</button>
          <p class="form-status" id="stayInformedStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <div data-chrome="footer"></div>
  <script src="script.js?v=20261010-2"></script>
</body>
</html>
