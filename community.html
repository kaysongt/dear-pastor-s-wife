<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Dear Pastor's Wife community: honest conversation with women who understand ministry life. Pick a topic, start a thread, and encourage one another." />
  <meta name="theme-color" content="#573a6f" />
  <title>Community | Dear Pastor's Wife</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="community">
  <div data-chrome="top"></div>

  <main id="top">
    <section class="page-hero section-shell">
      <p class="eyebrow">Community</p>
      <h1>A place to talk, ask, and encourage.</h1>
      <p>Join the conversation with women who understand ministry life. Pick a topic, start a thread, and reply to others. Honest support, no judgment.</p>
    </section>

    <section class="community section-shell page-section" id="community">
      <div class="forum" id="forum">
        <aside class="forum-topics" aria-label="Topics">
          <h3 class="forum-topics-title">Topics</h3>
          <div class="forum-topic-list" id="forumTopicList" role="tablist"></div>
          <div class="forum-identity">
            <label>Posting as
              <input type="text" id="forumName" placeholder="Your first name" maxlength="40" />
            </label>
          </div>
        </aside>

        <div class="forum-main">
          <div class="forum-main-head">
            <div>
              <h3 id="forumTopicTitle">Parenting in ministry</h3>
              <p id="forumTopicDesc" class="forum-topic-desc"></p>
            </div>
            <button class="button primary forum-new-btn" id="forumNewBtn" type="button">+ New thread</button>
          </div>

          <form class="forum-new-form" id="forumNewForm" hidden>
            <input type="text" id="forumThreadTitle" placeholder="Thread title" maxlength="120" required />
            <textarea id="forumThreadBody" placeholder="Share what's on your heart…" required></textarea>
            <div class="forum-new-actions">
              <button class="button primary" type="submit">Post thread</button>
              <button class="button ghost" type="button" id="forumCancelBtn">Cancel</button>
            </div>
          </form>

          <div class="forum-threads" id="forumThreads" aria-live="polite"></div>
          <p class="forum-empty" id="forumEmpty" hidden>No threads here yet. Be the first to start the conversation.</p>
        </div>
      </div>
    </section>
  </main>

  <div data-chrome="footer"></div>
  <script src="script.js"></script>
</body>
</html>
